name: Build and Deploy to CloudPanel

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_IMG_URL: ${{ secrets.VITE_IMG_URL }}
        run: npm run build

      - name: Deploy to CloudPanel via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          # Alternatively, if you use an SSH key instead of password:
          # ssh_private_key: ${{ secrets.SFTP_SSH_KEY }}
          # To deploy files directly into htdocs: './dist/*'
          # To deploy the 'dist' folder itself into htdocs: './dist'
          local_path: './dist/*'
          # CloudPanel site path: /home/<site-user>/htdocs/<your-domain>
          remote_path: ${{ secrets.SFTP_TARGET_PATH }}
          sftpArgs: '-o ConnectTimeout=60'
