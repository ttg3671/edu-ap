name: Build and Deploy to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_IMG_URL: ${{ secrets.VITE_IMG_URL }}
        run: npm run build

      - name: Clean old deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          script: |
            find /home/edumovimiento-admin/htdocs -mindepth 1 -maxdepth 1 \
              ! -name 'admin.edumovimiento.com' \
              -exec rm -rf {} +

      - name: Deploy to CloudPanel via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: ${{ secrets.SFTP_TARGET_PATH }}
          sftpArgs: '-o ConnectTimeout=60'
