name: Build and Deploy to CloudPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Remove old dist folder
        run: rm -rf dist

      - name: Build Project
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
          VITE_IMG_URL: ${{ secrets.VITE_IMG_URL }}
        run: npm run build

      - name: Deploy to CloudPanel via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/home/edumovimiento-admin/htdocs/dist'
          delete_remote_files: true
          sftpArgs: '-o ConnectTimeout=60'
